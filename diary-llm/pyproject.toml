[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-llm"
version = "0.1.0"
description = "Conversational AI diary workflow for OpenClaw / Telegram"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "cabinet>=1!3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
diary-llm = "diary_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
